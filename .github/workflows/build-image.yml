# Builds the ARIA Docker image and pushes it to GitHub Container Registry.
# Runs on GitHub because apt downloads are unreliable on our GitLab runner's network.
# Set ARIA_REVIEW_IMAGE in your GitLab group to:
#   ghcr.io/ssattv/aria:latest   (or :sha-<short-sha> to pin a build)

name: Build ARIA image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Lowercases the image name (ghcr.io requires it) and tags :latest plus :sha-<short-sha>
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
