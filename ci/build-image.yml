# ci/build-image.yml
# Runs in the aria project itself on commits to main.
# Builds the Docker image and pushes it to GitLab Container Registry.
# Set ARIA_REVIEW_IMAGE in your GitLab group to:
#   $CI_REGISTRY_IMAGE:latest   (resolved within this project's pipeline)

build-aria-image:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - docker build --network=host -t "$CI_REGISTRY_IMAGE:latest" .
    - docker push "$CI_REGISTRY_IMAGE:latest"
