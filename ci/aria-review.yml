# ci/aria-review.yml
# Include this in any project to add a manual AI code review job to MR pipelines.
#
# Prerequisites (set at GitLab group level):
#   GITLAB_URL          — base URL of GitLab instance
#   GITLAB_TOKEN        — access token with api scope
#   ARIA_REVIEW_IMAGE   — full Docker image ref, e.g. registry.example.com/group/aria:latest
#
# Optional (set at group or project level):
#   ARIA_MODEL          — model identifier, e.g. openai/gpt-4o (omit to use opencode default)
#   ARIA_MODEL_API_KEY  — provider API key (omit for free/keyless models)
#   ARIA_MODEL_BASE_URL — endpoint override for local/self-hosted models
#   ARIA_PROFILES       — comma-separated subset of personas to run, e.g. "functional,readability"
#                         (omit to run all: functional, architecture, security, performance, readability)
#                         Can be overridden per-run via the GitLab "Run pipeline" variable dialog.

ai_code_review:
  stage: review
  image: $ARIA_REVIEW_IMAGE
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
  variables:
    GIT_DEPTH: "0"
    ARIA_PROFILES: ""  # override to run a subset, e.g. "functional,readability"
  artifacts:
    paths:
      - .aria-review/comments.json
    expire_in: 7 days
    when: always
  script:
    - mkdir -p .aria-review
    - |
      # Map ARIA_MODEL_API_KEY to the provider-specific env var opencode expects
      if [[ -n "${ARIA_MODEL:-}" && -n "${ARIA_MODEL_API_KEY:-}" ]]; then
        provider=$(echo "$ARIA_MODEL" | cut -d'/' -f1 | tr '[:lower:]' '[:upper:]')
        export "${provider}_API_KEY=${ARIA_MODEL_API_KEY}"
      fi
      # Render opencode.json with the path of this project's checkout
      export ARIA_REVIEW_PATH="$CI_PROJECT_DIR"
      generate-opencode-config.sh > "$CI_PROJECT_DIR/opencode.json"
      # Fetch the list of files changed in this MR
      CHANGED_FILES=$(mktemp)
      gitlab-mr-changed-files.sh "$CI_PROJECT_ID" "$CI_MERGE_REQUEST_IID" > "$CHANGED_FILES"
      export CHANGED_FILES
      export FEATURE_BRANCH="$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME"
      export TARGET_BRANCH="$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
      # Run multi-persona review; || true so the job continues even if a persona crashes
      generate-review-comments.sh > .aria-review/comments.json || true
    - gitlab-mr-post-comments.sh "$CI_PROJECT_ID" "$CI_MERGE_REQUEST_IID" .aria-review/comments.json
