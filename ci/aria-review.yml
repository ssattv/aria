# ci/aria-review.yml
# Include this in any project to add a manual AI code review job to MR pipelines.
#
# Prerequisites (set at GitLab group level):
#   GITLAB_URL          — base URL of GitLab instance
#   GITLAB_TOKEN        — access token with api scope
#   ARIA_REVIEW_IMAGE   — full Docker image ref, e.g. registry.example.com/group/aria:latest
#
# Optional (set at group or project level):
#   ARIA_MODEL          — <provider>/<model>, e.g. openai/gpt-4o or openrouter/deepseek/deepseek-v4.1-flash-1017
#                         (omit to use opencode default)
#   ARIA_MODEL_API_KEY  — provider API key (omit for free/keyless models)
#   ARIA_MODEL_BASE_URL — endpoint override for local/self-hosted models
#   ARIA_PROFILES       — comma-separated subset of personas to run, e.g. "functional,readability"
#                         (omit to run all: functional, architecture, security, performance, readability)
#                         Can be overridden per-run via the GitLab "Run pipeline" variable dialog.
#
# Runner: needs a Docker-executor runner tagged "docker" that runs jobs from unprotected
# refs (MR pipelines are not protected). A shell executor ignores image:, so the job
# would run on the host without opencode or the ARIA scripts. To use another tag,
# override it in your project: ai_code_review: { tags: [my-docker-tag] }
# Only shell runners? Include ci/aria-review-shell.yml instead of this file.

ai_code_review:
  stage: review
  image: $ARIA_REVIEW_IMAGE
  tags:
    - docker
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
  variables:
    GIT_DEPTH: "0"
    ARIA_PROFILES: ""  # override to run a subset, e.g. "functional,readability"
  artifacts:
    paths:
      - .aria-review/comments.json
    expire_in: 7 days
    when: always
  # The image already has every tool; don't run the including project's global before_script
  before_script: []
  script:
    - |
      # Fail clearly if image: was ignored (shell executor) or the image is not the ARIA one
      command -v aria-review-job.sh >/dev/null 2>&1 || {
        echo "ERROR: ARIA scripts not found on PATH. This job must run in the ARIA_REVIEW_IMAGE image (${ARIA_REVIEW_IMAGE:-unset}) on a Docker executor runner; runner '${CI_RUNNER_DESCRIPTION:-unknown}' does not provide it. On a shell runner, include ci/aria-review-shell.yml instead." >&2
        exit 1
      }
    - aria-review-job.sh
